# Both DB and  applicaiton code 


services:

  api:
    build: .
    container_name: trade_api
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: trade_postgres
    environment:
      POSTGRES_DB: trade_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: